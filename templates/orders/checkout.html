{% extends "base.html" %}

{% block content %}
    <div class="checkout-page">

        <h2 class="checkout-title">주문서 작성</h2>

        <form method="post" class="checkout-form">
            {% csrf_token %}

            <div class="form-row">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-row">
                <label for="phone">전화번호</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <div class="form-row form-row-address">
                <label for="address">주소</label>
                <textarea id="address" name="address" rows="4" required></textarea>
            </div>

            <div class="checkout-actions">
                <button type="button" class="checkout-submit-btn" onclick="requestPay()">
                    결제하기
                </button>
            </div>
        </form>

    </div>

    <script src="https://js.tosspayments.com/v1/payment"></script>

    <script>
        function requestPay() {
            const nameInput = document.querySelector('input[name="name"]');
            const phoneInput = document.querySelector('input[name="phone"]');
            const addressInput = document.querySelector('textarea[name="address"]');

            if (!nameInput.value.trim()) {
                alert("이름을 입력해 주세요.");
                nameInput.focus();
                return;
            }

            if (!phoneInput.value.trim()) {
                alert("전화번호를 입력해 주세요.");
                phoneInput.focus();
                return;
            }

            if (!addressInput.value.trim()) {
                alert("주소를 입력해 주세요.");
                addressInput.focus();
                return;
            }

            const clientKey = "test_ck_여기에_키";

            const tossPayments = TossPayments(clientKey);

            tossPayments.requestPayment("카드", {
                amount: 1000,
                orderId: "ORDER_" + new Date().getTime(),
                orderName: "테스트 상품",
                customerName: nameInput.value.trim(),
                successUrl: "https://jparts.kr/pay/success/",
                failUrl: "https://jparts.kr/pay/fail/"
            });
        }
    </script>
{% endblock %}
