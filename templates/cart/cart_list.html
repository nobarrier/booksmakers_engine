{% extends "base.html" %}

{% block content %}
    <div class="cart-page">

        <h2 class="cart-title">장바구니</h2>

        {% if products %}
            <table class="cart-table">
                <thead>
                <tr>
                    <th>상품명</th>
                    <th>수량</th>
                    <th>가격</th>
                    <th>삭제</th>
                </tr>
                </thead>

                <tbody>
                {% for product in products %}
                    <tr>
                        <td class="cart-product-name">{{ product.name }}</td>

                        <td class="cart-quantity-cell">
                            <a class="cart-btn" href="{% url 'cart:cart_decrease' product.id %}">-</a>
                            <span class="cart-quantity">{{ product.total_quantity }}</span>
                            <a class="cart-btn" href="{% url 'cart:cart_increase' product.id %}">+</a>
                        </td>

                        <td class="cart-price">{{ product.total_price }} 원</td>

                        <td>
                            <a class="cart-btn cart-remove-btn" href="{% url 'cart:cart_remove' product.id %}">
                                삭제
                            </a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>

            <div class="cart-summary">
                <div class="cart-total">
                    총 금액: <strong>{{ total_price }} 원</strong>
                </div>

                <a href="{% url 'orders:checkout' %}" class="cart-order-btn">
                    주문하기
                </a>
            </div>

        {% else %}
            <div class="cart-empty">
                장바구니가 비어 있습니다.
            </div>
        {% endif %}

    </div>
{% endblock %}
